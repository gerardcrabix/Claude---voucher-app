name: Déployer sur GitHub Pages

# MVP local (sans backend) : ce workflow construit l'app et la publie sur
# GitHub Pages à chaque push sur les branches listées. Nécessite que le
# dépôt soit public et que Settings > Pages > Source soit réglé sur
# "GitHub Actions" (à faire une fois, manuellement).
on:
  push:
    branches:
      - main
      - claude/shared-voucher-tracker-pwa-nwxh7v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
